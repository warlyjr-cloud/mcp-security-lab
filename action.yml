name: MCP Security Lab
description: Audit a local MCP server with MCP Verifier and upload deterministic SARIF findings.
author: MCP Security Lab contributors

branding:
  icon: shield
  color: green

inputs:
  config:
    description: Path to an MCP Security Lab JSON configuration. Optional — provide this OR `package`/`command` for a zero-config run.
    required: false
  package:
    description: Zero-config shortcut — an npm package to launch via `npx -y <package>` (e.g. your published MCP server). Ignored when `config` is set.
    required: false
  command:
    description: Zero-config shortcut — the executable to launch the server (e.g. `node`). Use with `args`. Ignored when `config` or `package` is set.
    required: false
  args:
    description: Whitespace-separated arguments for `package`/`command` (e.g. `dist/server.js /tmp`). For complex args, use a `config` file instead.
    required: false
  execute:
    description: Start the configured server and inspect advertised MCP tool metadata.
    required: false
    default: "false"
  upload-sarif:
    description: Upload the generated SARIF file to GitHub code scanning.
    required: false
    default: "true"
  fail-on-findings:
    description: Fail after SARIF upload when high or critical findings exist.
    required: false
    default: "true"
  comment-pr:
    description: Post the scorecard as a comment on pull requests.
    required: false
    default: "false"
  github-token:
    description: GitHub token for posting PR comments.
    required: false

outputs:
  sarif:
    description: Absolute path to the generated SARIF file.
    value: ${{ steps.scan.outputs.sarif }}
  policy-exit-code:
    description: Scanner exit code, where 0 is clean and 2 means policy findings.
    value: ${{ steps.scan.outputs.policy_exit_code }}

runs:
  using: composite
  steps:
    - name: Install MCP Security Lab
      shell: bash
      env:
        MCP_SECURITY_LAB_NPM_CACHE: ${{ runner.temp }}/mcp-security-lab-npm
      run: >-
        npm ci
        --ignore-scripts
        --prefix "$GITHUB_ACTION_PATH"
        --cache "$MCP_SECURITY_LAB_NPM_CACHE"

    - name: Build MCP Security Lab
      shell: bash
      run: npm --prefix "$GITHUB_ACTION_PATH" run build

    - name: Resolve config
      id: resolve
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        DEST: ${{ runner.temp }}/mcp-security-lab.config.json
      run: |
        # An explicit config file always wins. Otherwise synthesize one from the
        # zero-config `package`/`command` shortcuts so a caller needs no JSON file.
        if [[ -n "$INPUT_CONFIG" ]]; then
          echo "config=$INPUT_CONFIG" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        node -e '
          const fs = require("fs");
          const pkg = process.env.INPUT_PACKAGE?.trim();
          const cmd = process.env.INPUT_COMMAND?.trim();
          const raw = (process.env.INPUT_ARGS || "").trim();
          const extra = raw ? raw.split(/\s+/) : [];
          let target;
          if (pkg) target = { command: "npx", args: ["-y", pkg, ...extra] };
          else if (cmd) target = { command: cmd, args: extra };
          else {
            console.error("mcp-security-lab: provide one of `config`, `package`, or `command`.");
            process.exit(1);
          }
          fs.writeFileSync(process.env.DEST, JSON.stringify({ target, policy: { timeoutMs: 60000, maxTools: 200 } }));
        '
        echo "config=$DEST" >> "$GITHUB_OUTPUT"

    - name: Scan MCP server
      id: scan
      shell: bash
      env:
        INPUT_CONFIG: ${{ steps.resolve.outputs.config }}
        INPUT_EXECUTE: ${{ inputs.execute }}
        SARIF_PATH: ${{ runner.temp }}/mcp-security-lab.sarif
      run: |
        args=(scan --config "$INPUT_CONFIG" --format sarif --output "$SARIF_PATH")
        if [[ "$INPUT_EXECUTE" == "true" ]]; then
          args+=(--execute)
        fi

        status=0
        node "$GITHUB_ACTION_PATH/dist/src/cli.js" "${args[@]}" || status=$?
        if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
          exit "$status"
        fi

        echo "sarif=$SARIF_PATH" >> "$GITHUB_OUTPUT"
        echo "policy_exit_code=$status" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: mcp-security-lab

    - name: Generate Markdown Scorecard
      if: ${{ inputs.comment-pr == 'true' }}
      shell: bash
      env:
        INPUT_CONFIG: ${{ steps.resolve.outputs.config }}
        INPUT_EXECUTE: ${{ inputs.execute }}
      run: |
        args=(scan --config "$INPUT_CONFIG" --format markdown --output MCP_SCORECARD.md)
        if [[ "$INPUT_EXECUTE" == "true" ]]; then
          args+=(--execute)
        fi
        node "$GITHUB_ACTION_PATH/dist/src/cli.js" "${args[@]}" || true

    - name: Post PR Comment
      if: ${{ inputs.comment-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-comment.js"

    - name: Enforce findings policy
      if: ${{ inputs.fail-on-findings == 'true' && steps.scan.outputs.policy_exit_code == '2' }}
      shell: bash
      run: |
        echo "MCP Security Lab found high or critical issues." >&2
        exit 2
