name: Bug report
description: Report a reproducible defect using synthetic data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private server responses, or personal data.
  - type: input
    id: version
    attributes:
      label: MCP Security Lab version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
