name: Release npm package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Run quality gates
        run: npm run quality
      - name: Verify release version
        run: npm run release:verify -- "${{ github.event.release.tag_name }}"
      - name: Build package and SBOM
        shell: bash
        run: |
          npm pack --json > pack-result.json
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          package_file="$(node -e "process.stdout.write(require('./pack-result.json')[0].filename)")"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"
      - name: Attest package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.PACKAGE_FILE }}
      - name: Publish with npm trusted publishing
        run: npm publish "$PACKAGE_FILE" --access public
      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" sbom.cdx.json
          --clobber
