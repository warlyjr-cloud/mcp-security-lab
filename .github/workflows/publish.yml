name: Publish to npm

# Publishes when a GitHub Release is published (Release Please creates the
# release). Requires an NPM_TOKEN secret (an npm automation token). Provenance
# needs id-token: write and npm >= 9.5 running in GitHub Actions.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # prepack runs the full build + test suite, so a broken build never ships.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
