name: Publish to npm

# Publishes the current package version to npm. Normally the release-please
# workflow publishes directly when it creates a release (a release created by
# GITHUB_TOKEN does not fire the `release: published` event, so we cannot rely on
# it). This workflow is kept as a manual escape hatch (workflow_dispatch) and for
# releases published by a human. Requires an NPM_TOKEN secret. Provenance needs
# id-token: write and npm >= 9.5 running in GitHub Actions.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # prepack runs the full build + test suite, so a broken build never ships.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
