name: SARIF smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run local action against the synthetic fixture
        uses: ./
        with:
          config: examples/insecure-server.json
          execute: "false"
          upload-sarif: "true"
          fail-on-findings: "false"
